services:
  - type: web
    name: smartpark-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpark-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://smartpark-client.onrender.com

  - type: web
    name: smartpark-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smartpark-server.onrender.com/api
      - key: VITE_WS_URL
        value: https://smartpark-server.onrender.com

databases:
  - name: smartpark-db
    plan: free
